<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Résultats de recherche - LocaLeaks</title>
  <link rel="icon" href="LocaLeaksFavicon.png" type="image/png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>
      <a href="index.html" style="color: inherit; text-decoration: none;">LocaLeaks</a>
    </h1>
  </header>
  <main>
    <section>
      <h2>Résultats de recherche</h2>
      <div id="results-list"></div>
    </section>
  </main>
  <footer>
    <p>&copy; 2025 LocaLeaks | Par les étudiants, pour les étudiants</p>
  </footer>
  <script>
    // Get query from URL
    const params = new URLSearchParams(window.location.search);
    const query = params.get("q") || "";

    async function fetchSuggestions(query) {
      const lonMin = 6.669, latMin = 43.407;
      const lonMax = 7.865, latMax = 44.234;
      const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&addressdetails=1&limit=10&viewbox=${lonMin},${latMax},${lonMax},${latMin}&bounded=1`;
      const res = await fetch(url, { headers: { "Accept-Language": "fr" } });
      return await res.json();
    }

    function formatPlace(place) {
      const addr = place.address || {};
      let label = "";
      if (addr.house_number) label += addr.house_number + " ";
      if (addr.road) label += addr.road;
      if (addr.postcode) label += ", " + addr.postcode;
      if (addr.city) label += " " + addr.city;
      return label || place.display_name;
    }

    async function showResults() {
      const resultsList = document.getElementById("results-list");
      resultsList.innerHTML = "<p>Chargement...</p>";
      const results = await fetchSuggestions(query);
      if (results.length === 0) {
        resultsList.innerHTML = "<p>Aucun résultat trouvé.</p>";
        return;
      }
      resultsList.innerHTML = "";
      results.forEach(place => {
        const div = document.createElement("div");
        div.className = "search-result";
        div.innerHTML = `<a href="address.html?lat=${place.lat}&lon=${place.lon}&label=${encodeURIComponent(formatPlace(place))}">${formatPlace(place)}</a>`;
        resultsList.appendChild(div);
      });
    }

    showResults();
  </script>
</body>
</html>
