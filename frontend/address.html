<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Détails du logement - LocaLeaks</title>
  <link rel="icon" href="LocaLeaksFavicon.png" type="image/png">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    #map { height: 300px; margin-bottom: 20px; border-radius: 8px; }

    #apartments-list {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-top: 10px;
    }

    .apartment-card {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 12px 16px;
      width: 280px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .apartment-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 12px rgba(0,0,0,0.15);
    }

    .apartment-card h4 {
      margin: 0 0 8px 0;
      font-size: 18px;
      color: #333;
    }

    .apartment-card p {
      margin: 4px 0;
      font-size: 14px;
      color: #555;
    }

    #addApartmentBtn {
      margin-top: 16px;
      padding: 10px 16px;
      font-size: 16px;
      background-color: #007bff;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }

    #addApartmentBtn:hover {
      background-color: #0056b3;
    }

    .warning-message {
      color: red;
      margin-top: 10px;
      opacity: 1;
      transition: opacity 0.5s ease;
    }
  </style>
</head>
<body>
  <header id="site-header">
  <h1>
    <a href="index.html" style="color: inherit; text-decoration: none;">LocaLeaks</a>
  </h1>
  </header>

  <main>
    <section id="address-info">
      <h2 id="address-title">Chargement...</h2>
      <div id="map"></div>
    </section>

    <section id="apartments">
      <h3>Appartements à cette adresse</h3>
      <div id="apartments-list"></div>
      <button id="addApartmentBtn">Ajouter un appartement</button>
    </section>
  </main>

  <script>
    function getQueryParam(name) {
      const params = new URLSearchParams(window.location.search);
      return params.get(name);
    }

    const lat = getQueryParam("lat");
    const lon = getQueryParam("lon");
    const label = decodeURIComponent(getQueryParam("label") || "");

    document.getElementById("address-title").textContent = label || "Adresse inconnue";

    if (lat && lon) {
      const map = L.map("map").setView([lat, lon], 16);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(map);
      L.marker([lat, lon]).addTo(map).bindPopup(label).openPopup();
    }

    const apartmentsList = document.getElementById("apartments-list");
    const addApartmentBtn = document.getElementById("addApartmentBtn");

    function renderApartments(apartments) {
      apartmentsList.innerHTML = "";
      if (!apartments || apartments.length === 0) {
        apartmentsList.innerHTML = "<p>Aucun appartement trouvé à cette adresse.</p>";
        return;
      }

      apartments.forEach(a => {
        const card = document.createElement("div");
        card.className = "apartment-card";

        // Charges
        let chargesDisplay = "N/A";
        if (a.charges) {
          chargesDisplay = `${a.charges.charges_amount}€`;
          const included = [];
          if (a.charges.water) included.push("Eau");
          if (a.charges.electricity) included.push("Électricité");
          if (a.charges.heating) included.push("Chauffage");
          if (a.charges.internet) included.push("Internet");
          if (a.charges.copropriete) included.push("Copropriété");
          if (included.length > 0) chargesDisplay += ` (${included.join(", ")})`;
        }

        // Landlord
        let landlordName = "Inconnu";
        if (a.landlord) {
          landlordName = a.landlord.name;
        }

        // Average rating
        let avgRating = "N/A";
        if (a.average_reviews && a.average_reviews.overall != null) {
          avgRating = a.average_reviews.overall.toFixed(1) + "/10";
        }

        card.innerHTML = `
          <h4>Appartement ${a.number || "N/A"}</h4>
          <p><strong>Propriétaire :</strong> ${landlordName}</p>
          <p><strong>Chambres :</strong> ${a.bedrooms || 0}</p>
          <p><strong>Salles de bain :</strong> ${a.bathrooms || 0}</p>
          <p><strong>Surface :</strong> ${a.size_sqm || "N/A"} m²</p>
          <p><strong>Loyer :</strong> ${a.rent != null ? a.rent.toFixed(2) + "€" : "N/A"}</p>
          <p><strong>Charges :</strong> ${chargesDisplay}</p>
          <p><strong>Note moyenne :</strong> ${avgRating}</p>
        `;

        card.addEventListener("click", () => {
          window.location.href = `apartment.html?id=${a.id}`;
        });

        apartmentsList.appendChild(card);
      });
    }

    async function loadApartments() {
      const token = localStorage.getItem("token");

      if (!token) {
        apartmentsList.innerHTML = `<p style="color: red;">Veuillez vous connecter pour accéder à cette fonctionnalité.</p>`;
        return;
      }

      try {
        const response = await fetch(`https://localeaks-webint-erz1.onrender.com/apartments?address=${encodeURIComponent(label)}`, {
          headers: {
            "Authorization": token ? `Bearer ${token}` : ""
          }
        });

        if (response.status === 401) {
          apartmentsList.innerHTML = `
            <p style="color: red;">Veuillez vous connecter ou créer un compte pour accéder à cette fonctionnalité.</p>
          `;
          return;
        }

        if (!response.ok) throw new Error("Erreur lors de la récupération des appartements");
        const data = await response.json();

        const results = data.apartments.filter(a =>
          a.address.toLowerCase().includes(label.toLowerCase())
        );
        renderApartments(results);

      } catch (err) {
        console.error(err);
        apartmentsList.innerHTML = "<p>Impossible de récupérer les appartements.</p>";
      }
    }
    
    loadApartments();

    addApartmentBtn.addEventListener("click", () => {
      const token = localStorage.getItem("token");
      if (!token) {
        const warning = document.createElement("p");
        warning.textContent = "Veuillez vous connecter pour ajouter un appartement.";
        warning.className = "warning-message";
        addApartmentBtn.insertAdjacentElement("afterend", warning);

        // Fade out after 3 seconds
        setTimeout(() => {
          warning.style.opacity = "0";
          setTimeout(() => warning.remove(), 500);
        }, 3000);
        return;
      }

      window.location.href = "add_apartment.html";
    });
  </script>

  <script src="header.js"></script>
</body>
</html>
