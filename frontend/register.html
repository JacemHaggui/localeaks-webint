<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscription - LocaLeaks</title>
  <link rel="icon" href="LocaLeaksFavicon.png" type="image/png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <img src="LocaLeaksLogo.jpg" alt="LocaLeaks Logo" class="site-logo">
    <h1>LocaLeaks</h1>
    <p>Donner du pouvoir aux étudiants. Responsabiliser les propriétaires.</p>
  </header>

  <main>
    <section>
      <h2>Créer un compte</h2>
      <form id="registerForm">
        <label>
          Nom complet
          <input type="text" id="name" placeholder="Votre nom" required>
        </label>
        <label>
          Email
          <input type="email" id="email" placeholder="Votre email" required>
        </label>
        <label>
          Mot de passe
          <input type="password" id="password" placeholder="Mot de passe" required>
        </label>
        <button type="submit">S'inscrire</button>
        <div id="formMessage"></div>
      </form>
      <p>Vous avez déjà un compte ? <a href="login.html">Connectez-vous</a></p>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 LocaLeaks | Par les étudiants, pour les étudiants</p>
  </footer>

  <script>
    const form = document.getElementById('registerForm');
    const message = document.getElementById('formMessage');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      message.textContent = "";

      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('https://localeaks-webint-erz1.onrender.com/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "Erreur lors de l'inscription");

        message.style.color = "#4da6ff";
        message.textContent = "Inscription réussie ! Vérifiez votre email pour le code de vérification.";
        setTimeout(() => {
          window.location.href = "verify.html?email=" + encodeURIComponent(email);
        }, 1500);

      } catch (err) {
        message.style.color = "red";
        message.textContent = err.message;
      }
    });
  </script>
</body>
</html>
