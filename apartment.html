<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Appartement - LocaLeaks</title>
  <link rel="icon" href="LocaLeaksFavicon.png" type="image/png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="site-header"></header>

  <main>
    <section id="apartment-info">
      <h2 id="apt-title">Chargement...</h2>
      <p id="apt-address"></p>
    </section>

    <!-- Galerie photos -->
    <section id="media-gallery">
      <h3>Photos</h3>
      <div id="photo-grid" class="photo-grid"></div>

      <h3>Vidéos de visite</h3>
      <div id="video-list" class="video-list"></div>
    </section>

    <section id="apartment-details">
      <h3>Détails</h3>
      <div id="apt-details-content"></div>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 LocaLeaks | Par les étudiants, pour les étudiants</p>
  </footer>

  <script src="script/utils.js" defer></script>
  <script src="script/header.js" defer></script>
  <script>
    function getQueryParam(name) {
      return new URLSearchParams(window.location.search).get(name);
    }

    const aptId = getQueryParam("id");

    async function loadApartment() {
      const token = localStorage.getItem("token");

      try {
        const response = await fetch('data/apartments.json');
        const data = await response.json();

        const apt = data.apartments.find(a => a.id === parseInt(aptId));
        if (!apt) throw new Error("Introuvable");

        document.getElementById("apt-title").textContent = `Appartement ${apt.number}`;
        document.getElementById("apt-address").textContent = apt.address;

        document.getElementById("apt-details-content").innerHTML = `
          <p><strong>Chambres :</strong> ${apt.bedrooms || 0}</p>
          <p><strong>Salles de bain :</strong> ${apt.bathrooms || 0}</p>
          <p><strong>Surface :</strong> ${apt.size_sqm || "N/A"} m²</p>
          <p><strong>Loyer :</strong> ${apt.rent != null ? apt.rent.toFixed(2) + "€" : "N/A"}</p>
        `;

        loadMedia(apt);

      } catch (err) {
        console.error(err);
        document.getElementById("apt-title").textContent = "Appartement introuvable";
      }
    }

    function loadMedia(apt) {
      const basePath = `media/${apt.media_folder}`;

      const photoGrid = document.getElementById("photo-grid");
      const videoList = document.getElementById("video-list");

      ["photo1", "photo2", "photo3"].forEach(name => {
        const img = document.createElement("img");
        img.src = `${basePath}/${name}.jpeg`;
        img.alt = `Photo du logement`;
        img.className = "apt-photo";
        img.onerror = () => img.remove();
        photoGrid.appendChild(img);
      });

      ["visite1", "visite2", "visite3"].forEach(name => {
      const video = document.createElement("video");
      video.controls = true;
      video.className = "apt-video";

      const source = document.createElement("source");
      source.src = `${basePath}/${name}.mp4`;
      source.type = "video/mp4";
      video.appendChild(source);

      video.addEventListener("error", () => video.remove());
      source.addEventListener("error", () => video.remove());

      videoList.appendChild(video);
    });
    }

    loadApartment();
  </script>
</body>
</html>
